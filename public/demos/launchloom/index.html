  <meta name="robots" content="noindex">

<body data-accent="launchloom">

  <p class="notice">構想デモ・架空データ。書き出しも投稿も行いません。</p>
  <header class="top"><a class="brand" href="/products/launchloom/">Launchloom <span>構想デモ</span></a><a class="back" href="/products/launchloom/#concept-demos">製品ページへ戻る</a></header>
  <main id="stage" class="stage">
    <h1>作った、その先まで。</h1>
    <nav class="tabs" aria-label="用途">

      </section>
    </div>
    <noscript><p class="nojs">このデモはJavaScriptで動きます。流れ：1. 実画面の録画と、伝えたいことを入れる　2. 構成を確かめる　3. 動画・LP・投稿案を書き出す　4. 公開は、承認したものだけ。</p></noscript>
