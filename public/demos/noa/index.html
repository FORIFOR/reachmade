<body data-accent="noa">

  <header class="top"><a class="brand" href="/products/noa/">星藍ノア <span>構想デモ</span></a><a class="back" href="/products/noa/#concept-demos">製品ページへ戻る</a></header>
  <main id="stage" class="stage">
    <h1>コメントがなくても、話が続く。</h1>
    <nav class="tabs" aria-label="用途">

      </section>

    <noscript><p class="nojs">このデモはJavaScriptで動きます。流れ：1. コメントが届く　2. 短い返事を考える　3. 出力ゲートで確かめる　4. 通ったら声と表情で返す。通らなければ話さない。</p></noscript>
