name: Owned product pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - name: Rebuild clean final pages after build-contract tests
        run: npm run build
      - run: node scripts/vendor-website-media.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Current layouts, real playback and network-failure recovery
        run: python scripts/verify-product-landings.py
      - name: Preserve measured report even when artifact storage is full
        if: always()
        run: |
          if [ -f film-qa/products/report.json ]; then
            cat film-qa/products/report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        id: screenshots
        if: always()
        continue-on-error: true
        with:
          name: owned-product-pages-qa
          path: |
            film-qa/products/
            film-qa/outcome-first/chromium/
          retention-days: 3
      - name: Disclose unavailable image artifacts
        if: always() && steps.screenshots.outcome == 'failure'
        run: echo '::warning::Artifact upload failed. Browser assertions remain required. Reports are in the logs/summary; image availability is not claimed.'
