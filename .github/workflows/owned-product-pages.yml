name: Owned product pages
on:
  pull_request:
    paths: ['src/product-landings.mjs', 'src/site-experience.mjs', 'src/site-content.mjs', 'scripts/build*.mjs', 'public/assets/product-landings.*', 'tests/product-landings.test.mjs', 'scripts/verify-product-landings.py', '.github/workflows/owned-product-pages.yml']
  push:
    branches: [main]
    paths: ['src/product-landings.mjs', 'src/site-experience.mjs', 'src/site-content.mjs', 'scripts/build*.mjs', 'public/assets/product-landings.*', 'scripts/verify-product-landings.py', '.github/workflows/owned-product-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run media:prepare
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Test the complete pages and actual recordings
        run: |
          npx wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > /tmp/owned-pages-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python scripts/verify-product-landings.py
      - name: Preserve the actual check report in the job summary
        if: always()
        run: |
          if [ -f film-qa/product-landings/report.json ]; then
            printf '## Local Chromium checks (not production or Safari)\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat film-qa/product-landings/report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No browser report was produced; earlier steps must be checked.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve optional screenshots when artifact storage is available
        id: screenshots
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: owned-product-pages-review
          path: film-qa/product-landings/
          retention-days: 1
      - name: Disclose unavailable review images
        if: always() && steps.screenshots.outcome == 'failure'
        run: |
          echo '::warning::Screenshots could not be archived. The browser test remains required; its report is in the log and job summary. No visual review of the missing artifact is claimed.'
          printf '\n**Screenshot archival failed.** The tests above remain required. Images are unavailable for visual review; no billing or existing artifact data was changed.\n' >> "$GITHUB_STEP_SUMMARY"
