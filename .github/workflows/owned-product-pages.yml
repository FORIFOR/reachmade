name: Owned product pages
on:
  pull_request:
    paths: ['src/product-landings.mjs', 'src/site-experience.mjs', 'src/site-content.mjs', 'scripts/build*.mjs', 'public/assets/product-landings.*', 'tests/product-landings.test.mjs', 'scripts/verify-product-landings.py', '.github/workflows/owned-product-pages.yml']
  push:
    branches: [main]
    paths: ['src/product-landings.mjs', 'src/site-experience.mjs', 'src/site-content.mjs', 'scripts/build*.mjs', 'public/assets/product-landings.*', 'scripts/verify-product-landings.py', '.github/workflows/owned-product-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run media:prepare
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Test the complete pages and actual recordings
        run: |
          npx wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > /tmp/owned-pages-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python scripts/verify-product-landings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-product-pages-review
          path: film-qa/product-landings/
          retention-days: 7
