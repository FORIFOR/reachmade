name: Product film playback QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/product-film-qa.yml'
      - 'scripts/verify-product-films.py'
      - 'scripts/product_film_contract.py'
      - 'tests/test_product_film_contract.py'
      - 'scripts/prepare-media.mjs'
      - 'src/films.mjs'
      - 'src/products.mjs'
      - 'src/premium-film-cuts.mjs'
      - 'public/assets/product-films.*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-film-qa.yml'
      - 'scripts/verify-product-films.py'
      - 'scripts/product_film_contract.py'
      - 'tests/test_product_film_contract.py'
      - 'scripts/prepare-media.mjs'
      - 'src/films.mjs'
      - 'src/products.mjs'
      - 'src/premium-film-cuts.mjs'
      - 'public/assets/product-films.*'
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese glyphs for real browser rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match sans-serif:lang=ja
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - name: Check the manifest and directory coverage contract
        run: python -m unittest discover -s tests -p 'test_product_film_contract.py' -v
      - name: Ensure video render and inspection tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Render all website masters from the source films
        run: npm run media:prepare
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify rendered recordings and built product pages
        run: python scripts/verify-product-films.py
      - name: Put verification results in the job summary
        if: always()
        run: |
          if [ -f film-qa/report.json ]; then
            printf '## Premium product film verification\n\nRendered real-recording edits, locally built pages; not production or Safari.\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat film-qa/report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive screenshots when explicitly enabled
        uses: actions/upload-artifact@v4
        if: ${{ always() && vars.REACHMADE_QA_UPLOAD_ARTIFACTS == 'true' }}
        continue-on-error: true
        with:
          name: premium-product-film-qa
          path: film-qa/
          retention-days: 7
