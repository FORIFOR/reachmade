name: Product Lab art direction
on:
  pull_request:
    paths: ['src/**', 'public/assets/**', 'scripts/build*.mjs', 'scripts/verify-lab-signature.py', 'tests/**', '.github/workflows/lab-signature-qa.yml']
  push:
    branches: [main]
    paths: ['src/**', 'public/assets/**', 'scripts/build*.mjs', 'scripts/verify-lab-signature.py', 'tests/**', '.github/workflows/lab-signature-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-signature-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
      QA_BROWSERS: chromium,webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - name: Prepare the real product recordings and posters
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npm run media:prepare
      - name: Install Chromium and WebKit
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Check the built site with desktop and touch viewports
        run: |
          npx wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > /tmp/signature-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python scripts/verify-lab-signature.py
      - name: Report measured results, not a physical-device claim
        if: always()
        run: |
          printf '## Product Lab — Chromium / WebKit\n\nLocal built site; not production or a physical iPhone.\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f film-qa/lab-signature/report.json ]; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat film-qa/lab-signature/report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No browser report was produced. Check earlier steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive review evidence when storage is available
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: product-lab-art-direction
          path: film-qa/lab-signature/
          retention-days: 2
