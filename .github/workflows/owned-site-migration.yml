name: Owned site migration validation
on:
  push:
    branches: [migrate/owned-sites-20260919]
    paths: ['.github/workflows/owned-site-migration.yml', 'scripts/migrations/*.py', 'src/owned-*.mjs', 'scripts/verify-owned*.py', 'tests/owned*.test.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: owned-site-migration
  cancel-in-progress: false
jobs:
  migrate-and-verify:
    if: github.ref == 'refs/heads/migrate/owned-sites-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare validation tools
        run: |
          {
            if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
            python -m pip install playwright==1.57.0
            python -m playwright install --with-deps chromium
          } > /tmp/owned-tools.log 2>&1 || { tail -60 /tmp/owned-tools.log; exit 1; }
          echo 'FFmpeg and browser tools ready'
      - name: Import owned media and migrate current links
        run: |
          python scripts/migrations/finish-owned-sites.py prepare
          python scripts/migrations/owned-sites-20260919.py
          python scripts/migrations/finish-owned-sites.py finish
          python scripts/migrations/complete-owned-runtime.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('public/media/originals/genie/orbit.html')
          p.write_text(p.read_text().replace('href="./orbit-','href="/media/originals/genie/orbit-').replace('src="./orbit-','src="/media/originals/genie/orbit-'))
          manifest_path=Path('public/media/originals/manifest.json');manifest=json.loads(manifest_path.read_text())
          for item in manifest['files']:
              if item['path']=='/media/originals/genie/orbit.html':item.update(bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest())
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate source and build
        run: |
          npm run check > /tmp/owned-check.log 2>&1 || {
            grep -A32 -B2 '^not ok' /tmp/owned-check.log || true
            tail -12 /tmp/owned-check.log
            exit 1
          }
          tail -12 /tmp/owned-check.log
      - name: Build recordings without the old hosts
        run: npm run media:prepare
      - name: Browser-check pages and original recordings
        run: |
          npx wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > /tmp/owned-site-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python scripts/verify-owned-sites.py
          python scripts/verify-owned-artifact.py
      - name: Preserve checked media for Node-only Cloudflare Git builds
        run: |
          cp -a dist/media/. public/media/
          npm run check > /tmp/owned-rebuild.log 2>&1 || { tail -70 /tmp/owned-rebuild.log; exit 1; }
          tail -12 /tmp/owned-rebuild.log
      - name: Commit only the reviewed migration outputs to the migration branch
        run: |
          git add src scripts/build.mjs scripts/build-core.mjs scripts/prepare-media.mjs tests public/assets public/media docs README.md worker.js site.config.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Migrate Genie and AI Meeting site links and verified original recordings to Reachmade'
            git push origin HEAD:refs/heads/migrate/owned-sites-20260919
          fi
          echo "MIGRATION_HEAD=$(git rev-parse HEAD)"
      - name: Keep validation summary even when artifact storage is unavailable
        if: always()
        run: |
          if [ -f docs/owned-site-migration-browser.json ]; then cat docs/owned-site-migration-browser.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f /tmp/owned-site-worker.log ]; then tail -40 /tmp/owned-site-worker.log; fi
