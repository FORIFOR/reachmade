name: Owned site regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owned-site-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate the merged source and static build
        run: npm run check
      - name: Verify every tracked original asset
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=json.loads(Path('public/media/originals/manifest.json').read_text())
          for item in manifest['files']:
              raw=(Path('public')/item['path'].lstrip('/')).read_bytes()
              assert len(raw)==item['bytes'],item['path']
              assert hashlib.sha256(raw).hexdigest()==item['sha256'],item['path']
          print('Verified original assets:',len(manifest['files']))
          PY
      - name: Prepare the browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check owned pages, original media and generated artifact
        run: |
          npx wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > /tmp/owned-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python scripts/verify-owned-sites.py
          python scripts/verify-owned-artifact.py
      - name: Summarize checks without uploading artifacts
        if: always()
        run: |
          for file in docs/owned-site-migration-browser.json docs/owned-artifact-browser.json; do
            if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          if [ -f /tmp/owned-worker.log ]; then tail -20 /tmp/owned-worker.log; fi
