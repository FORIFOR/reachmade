name: Check owned-site deployment configuration
on:
  push:
    branches: [ops/check-owned-site-deployment-20260919]
    paths: [.github/workflows/owned-site-deployment-check.yml]
permissions:
  contents: read
jobs:
  readiness:
    if: github.ref == 'refs/heads/ops/check-owned-site-deployment-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report configuration availability only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'OWNED_SITE_DEPLOYMENT_CONFIGURED=yes'
          else
            echo 'OWNED_SITE_DEPLOYMENT_CONFIGURED=no'
            echo 'No credentials were printed or changed. Native Cloudflare Git deployment, if configured separately, is not assessed by this check.'
          fi
