name: Packaged media and visitor journey
on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'public/**', 'tests/**', 'package.json', '.github/workflows/packaged-media-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  built-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run media:prepare
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Run the real worker and static binding locally
        env:
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
        run: |
          npx wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > /tmp/reachmade-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python scripts/verify-packaged-films.py
      - name: Report actual results
        if: always()
        run: |
          if [ -f film-qa/packaged-report.json ]; then
            printf '## Built-page and packaged-media checks\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat film-qa/packaged-report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
