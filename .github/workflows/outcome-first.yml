name: Outcome first acceptance
on:
  pull_request:
    paths: ['src/**', 'public/assets/**', 'scripts/**', 'tests/**', '.github/workflows/outcome-first.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: outcome-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      # Some existing tests exercise build functions. Test a fresh final build.
      - run: npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python scripts/verify-outcome-first.py --browser ${{ matrix.browser }}
      - name: Preserve visual review when artifact storage is available
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: outcome-first-${{ matrix.browser }}
          path: film-qa/outcome-first/${{ matrix.browser }}/
          retention-days: 3
      - name: Always print the measured result
        if: always()
        run: |
          if [ -f film-qa/outcome-first/${{ matrix.browser }}/report.json ]; then
            cat film-qa/outcome-first/${{ matrix.browser }}/report.json >> "$GITHUB_STEP_SUMMARY"
          fi
